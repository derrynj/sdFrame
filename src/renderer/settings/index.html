<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
  <title>sdFrame Settings</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>sdFrame</h1>
    </header>

    <section class="add-frame">
      <h2>Add New Frame</h2>
      <form id="add-frame-form">
        <div class="form-group">
          <label for="name-input">Name (optional)</label>
          <input 
            type="text" 
            id="name-input" 
            placeholder="Frame name"
          >
        </div>
        <div class="form-group">
          <label for="url-input">URL</label>
          <input 
            type="url" 
            id="url-input" 
            placeholder="https://example.com" 
            required
          >
        </div>
        <button type="submit" class="btn btn-primary">Add Frame</button>
      </form>
    </section>

    <section class="frames-list">
      <h2>Frames</h2>
      <div class="bulk-actions">
        <button id="enable-all-btn" class="btn btn-secondary">Enable All</button>
        <button id="disable-all-btn" class="btn btn-secondary">Disable All</button>
      </div>
      <div id="frames-container">
        <p class="no-frames">No frames configured</p>
      </div>
    </section>

    <section class="global-settings">
      <h2>Settings</h2>
      
      <div class="setting-row">
        <label>
          <input type="checkbox" id="snap-enabled">
          Enable Snapping
        </label>
      </div>

      <div class="setting-row">
        <label>
          <input type="checkbox" id="group-movement">
          Group Movement
        </label>
      </div>

      <div class="setting-row">
        <label for="snap-threshold">Snap Threshold</label>
        <select id="snap-threshold">
          <option value="5">5px</option>
          <option value="10">10px</option>
          <option value="15">15px</option>
          <option value="20">20px</option>
          <option value="25">25px</option>
          <option value="30">30px</option>
        </select>
      </div>

      <div class="setting-row">
        <label>
          <input type="checkbox" id="layout-locked">
          Lock Layout
        </label>
      </div>

      <div class="setting-row">
        <label>
          <input type="checkbox" id="always-on-top">
          Always on Top
        </label>
      </div>

      <div class="setting-row">
        <label for="log-level">Log Level</label>
        <select id="log-level">
          <option value="debug">Debug</option>
          <option value="info">Info</option>
          <option value="warn">Warn</option>
          <option value="error">Error</option>
        </select>
      </div>

      <div class="setting-row">
        <label for="frame-width">Frame Width</label>
        <input type="number" id="frame-width" min="100" max="5000" step="10">
      </div>

      <div class="setting-row">
        <label for="frame-height">Frame Height</label>
        <input type="number" id="frame-height" min="100" max="5000" step="10">
      </div>

      <h2 class="subsection-title">Snapped Group Height</h2>
      <div class="setting-row group-height-row">
        <label for="group-height-frame">Frame in snapped group</label>
        <select id="group-height-frame"></select>
      </div>
      <div class="setting-row group-height-row">
        <label for="group-height-input">Height</label>
        <div class="group-height-controls">
          <input type="number" id="group-height-input" min="100" max="5000" step="10">
          <button id="apply-group-height-btn" class="btn btn-primary">Apply</button>
        </div>
      </div>
      <p id="group-height-status" class="config-file-status" role="status" aria-live="polite"></p>

      <div class="setting-row">
        <button id="reset-dimensions-btn" class="btn btn-secondary">Reset All Dimensions</button>
      </div>

      <div class="setting-row">
        <button id="reset-all-btn" class="btn btn-secondary">Reset All Positions</button>
      </div>

      <div class="setting-row config-file-actions">
        <button id="import-config-btn" class="btn btn-secondary">Import Config</button>
        <button id="export-config-btn" class="btn btn-secondary">Export Config</button>
      </div>
      <p id="config-file-status" class="config-file-status" role="status" aria-live="polite"></p>

      <dialog id="config-import-dialog" class="config-import-dialog" aria-labelledby="config-import-title">
        <h2 id="config-import-title">Choose what to import</h2>
        <p id="config-import-file" class="import-help"></p>
        <label class="import-settings-option">
          <input type="checkbox" id="import-settings-checkbox" checked>
          <span><strong>Import all settings</strong><small>Use the selected file's global settings.</small></span>
        </label>
        <fieldset class="import-mode-options">
          <legend>Frames</legend>
          <label>
            <input type="radio" name="import-mode" value="add" checked>
            Add to existing frames
          </label>
          <label>
            <input type="radio" name="import-mode" value="replace">
            Replace existing frames
          </label>
        </fieldset>
        <div class="import-frame-heading">
          <strong>Frames to import</strong>
          <span>
            <button id="select-all-import-frames" class="text-button" type="button">Select all</button>
            <button id="clear-import-frames" class="text-button" type="button">Clear</button>
          </span>
        </div>
        <p id="import-frame-count" class="import-help"></p>
        <div id="import-frame-list" class="import-frame-list"></div>
        <p id="import-dialog-status" class="import-dialog-status" role="status" aria-live="polite"></p>
        <div class="import-dialog-actions">
          <button id="cancel-import-btn" class="btn btn-secondary" type="button">Cancel</button>
          <button id="apply-import-btn" class="btn btn-primary" type="button">Import selected</button>
        </div>
      </dialog>
    </section>
  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
